name: Validate public site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate publication policy
        run: python scripts/validate_publication.py

      - name: Validate evidence frontend syntax
        run: node --check docs/javascripts/evidence-popover-v3.js

      - name: Build site strictly
        run: mkdocs build --strict
